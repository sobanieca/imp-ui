[workspace]
resolver = "3"
members = ["cli", "xtask"]
default-members = ["cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/sobanieca/imp-ui"
publish = false

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
lto = "off"
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
panic = "abort"

[patch.crates-io]
oxc = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.153.0" }
oxc_allocator = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.153.0" }
