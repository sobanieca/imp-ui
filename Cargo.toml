[workspace]
resolver = "3"
members = ["cli", "xtask"]
default-members = ["cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/sobanieca/imp-ui"
publish = false

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2

[profile.local]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false

[profile.test]
opt-level = 1
