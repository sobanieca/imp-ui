<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>imp-ui — render.js basics</title>
    <style>
    body {
      margin: 0;
      background: #0f1115;
      color: #e6e8ee;
      font: 14px/1.6 system-ui, sans-serif;
    }
    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 40px 24px;
    }
    h1 {
      margin: 0 0 4px;
    }
    .muted {
      color: #8a90a2;
    }
    .demo {
      border: 1px solid #272c38;
      border-radius: 12px;
      margin: 18px 0;
      overflow: hidden;
    }
    .demo h2 {
      font-size: 14px;
      margin: 0;
      padding: 14px 16px;
      background: #171a21;
    }
    pre {
      margin: 0;
      padding: 14px 16px;
      background: #12151c;
      overflow-x: auto;
      color: #aab2ff;
      font: 12px/1.6 ui-monospace, Menlo, monospace;
    }
    .demo-output {
      padding: 16px;
      border-top: 1px solid #272c38;
    }
    .lead {
      font-size: 16px;
    }
    .tag {
      padding: 2px 8px;
      border-radius: 6px;
      background: #1d212a;
      font-size: 12px;
    }
    .tag-ok {
      color: #4ade80;
    }
    .inline {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .count {
      font-weight: 700;
      color: #6d8bff;
    }
    .btn {
      background: #6d8bff;
      color: #0f1115;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    a {
      color: #6d8bff;
    }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="basics.js"></script>
  </body>
</html>
