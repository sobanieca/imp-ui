[package]
name = "imp"
description = "imp - buildless UI toolkit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
name = "imp"
path = "src/lib.rs"

[[bin]]
name = "imp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arcstr = "1"
base64 = "0.23"
dprint-plugin-json = "0.26"
dprint-plugin-markdown = "0.29"
flate2 = "1"
gif = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
jsonc-parser = { version = "0.34", features = ["serde", "cst"] }
malva = "0.16"
lax-sql = "0.3"
markup_fmt = "0.27"
nodejs-semver = "7"
notify = "8"
oxc_formatter = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.157.0" }
oxc_formatter_core = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.157.0" }
oxc = { version = "0.157", features = ["semantic", "codegen", "ast_visit"] }
pretty_yaml = "0.6"
regex = "1"
ring = "0.17"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
resvg = { version = "0.49", default-features = false, features = ["raster-images"] }
rolldown = "1.3.0"
rolldown_plugin = "1.3.0"
rolldown_common = "1.3.0"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
sha1 = "0.11"
tar = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
rquickjs = { version = "0.14", features = ["loader"] }
if-addrs = "0.15.0"
ctrlc = "3.5.2"
