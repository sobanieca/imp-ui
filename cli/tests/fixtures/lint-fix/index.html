<!doctype html>
<html>
  <head>
    <script type="importmap">{ "imports": { "imp": "/@imp/imp.js" } }</script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { mount } from 'imp'
      import { div } from 'imp/html'

      const label = (on) => div(!!on ? 'on' : 'off')

      mount('#app', () => div(label(true)))
    </script>
  </body>
</html>
