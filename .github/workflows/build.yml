name: CI

# Runs on every push to main and on demand from the Actions tab. A run on main deploys the site to
# https://imp-ui.com. It also releases the version in Cargo.toml when that version has no tag.
# Add the `ci` label to a PR to check it and every later push.
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [labeled, synchronize, reopened]

jobs:
  check:
    name: Format and lint
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'ci') &&
       (github.event.action != 'labeled' || github.event.label.name == 'ci'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format, lint and licenses
        run: cargo xtask check --verify
      - name: Install scripts parse
        run: |
          bash -n install.sh
          pwsh -NoProfile -Command '$errors = $null; [System.Management.Automation.Language.Parser]::ParseFile("install.ps1", [ref] $null, [ref] $errors) | Out-Null; if ($errors) { $errors; exit 1 }'

  test:
    name: Tests ${{ matrix.suite }} (${{ matrix.os }})
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'ci') &&
       (github.event.action != 'labeled' || github.event.label.name == 'ci'))
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        suite: [unit, e2e, cli]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Use a time zone with daylight saving time
        if: runner.os == 'Windows'
        run: tzutil /s "Central European Standard Time"
      - name: Build imp
        run: cargo build --locked --package imp
      - name: Library unit tests
        if: matrix.suite == 'unit' && runner.os != 'Windows'
        working-directory: lib/test
        env:
          TZ: Europe/Warsaw
        run: cargo imp test --unit
      - name: Library unit tests (Windows)
        if: matrix.suite == 'unit' && runner.os == 'Windows'
        working-directory: lib/test
        run: cargo imp test --unit
      - name: Library e2e tests
        if: matrix.suite == 'e2e'
        working-directory: lib/test
        run: cargo imp test --e2e
      - name: CLI tests
        if: matrix.suite == 'cli'
        run: cargo test --locked --workspace

  size:
    name: Binary size
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'ci') &&
       (github.event.action != 'labeled' || github.event.label.name == 'ci'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check binary size against limit
        run: cargo xtask binary-size

  version:
    name: Release version
    needs: [check, test, size]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.tag.outputs.exists }}
    steps:
      - uses: actions/checkout@v7

      - name: Read version from Cargo.toml
        id: version
        run: echo "version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "imp") | .version')" >> $GITHUB_OUTPUT

      - name: Skip if the release already exists
        id: tag
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/v${{ steps.version.outputs.version }}$"; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build ${{ matrix.asset }}
    needs: version
    if: needs.version.outputs.exists == 'false'
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: imp-linux-x64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: imp-linux-arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: imp-macos-x64
          - runner: macos-latest
            target: aarch64-apple-darwin
            asset: imp-macos-arm64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset: imp-windows-x64.exe
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: imp-windows-arm64.exe
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Compile ${{ matrix.asset }}
        run: |
          cargo build --locked --release --package imp --target ${{ matrix.target }}
          suffix=""
          case "${{ matrix.target }}" in *windows*) suffix=".exe" ;; esac
          cp "target/${{ matrix.target }}/release/imp${suffix}" "${{ matrix.asset }}"

      - name: Smoke test ${{ matrix.asset }}
        run: |
          binary="$PWD/${{ matrix.asset }}"
          reported="$("$binary" --version | tr -d '\r')"
          if [ "$reported" != "${{ needs.version.outputs.version }}" ]; then
            echo "imp --version printed '$reported', expected '${{ needs.version.outputs.version }}'"
            exit 1
          fi
          work="$(mktemp -d)"
          cd "$work"
          "$binary" init app
          cd app
          "$binary" build
          test -f dist/index.html
          "$binary" test --unit

      - name: Checksum ${{ matrix.asset }}
        run: |
          if command -v sha256sum > /dev/null; then
            hash="$(sha256sum "${{ matrix.asset }}" | awk '{print $1}')"
          else
            hash="$(shasum -a 256 "${{ matrix.asset }}" | awk '{print $1}')"
          fi
          printf '%s  %s\n' "$hash" "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          cat "${{ matrix.asset }}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
          if-no-files-found: error

  release:
    name: Release
    needs: [version, build]
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Skip if the release already exists
        id: tag
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/v${{ needs.version.outputs.version }}$"; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/download-artifact@v8
        if: steps.tag.outputs.exists == 'false'
        with:
          pattern: imp-*
          path: release
          merge-multiple: true

      - name: Verify the checksums
        if: steps.tag.outputs.exists == 'false'
        working-directory: release
        run: |
          test "$(ls *.sha256 | wc -l)" -eq 6
          sha256sum --check --strict *.sha256

      - name: Create release
        if: steps.tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Release v${{ needs.version.outputs.version }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            release/imp-linux-x64
            release/imp-linux-x64.sha256
            release/imp-linux-arm64
            release/imp-linux-arm64.sha256
            release/imp-macos-x64
            release/imp-macos-x64.sha256
            release/imp-macos-arm64
            release/imp-macos-arm64.sha256
            release/imp-windows-x64.exe
            release/imp-windows-x64.exe.sha256
            release/imp-windows-arm64.exe
            release/imp-windows-arm64.exe.sha256

  pages:
    name: Site
    needs: [version, release]
    if: >-
      !cancelled() && needs.version.result == 'success' &&
      needs.release.result != 'failure'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the site
        env:
          IMP_SITE_URL: https://imp-ui.com
          IMP_SITE_ALY_SERVER: "" # https://aly.admware.com once the server is set up
        run: cargo xtask build-site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@v4
