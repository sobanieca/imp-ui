name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
      - name: Format check
        run: deno fmt --check
      - name: Lint
        run: deno lint
      - name: Library lint
        run: cd lib/src && deno run -A ../../tools/imp.js lint

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
      - name: Tests
        run: deno task test

  size:
    name: Binary size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
      - name: Compile imp
        run: deno run -A tools/compile.js
      - name: Check binary size against limit
        run: deno run -A tools/check-binary-size.js

  release:
    name: Release
    needs: [check, test, size]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Read version from deno.json
        id: version
        run: echo "version=$(deno eval "console.log(JSON.parse(Deno.readTextFileSync('deno.json')).version)")" >> $GITHUB_OUTPUT

      - name: Skip if the release already exists
        id: tag
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/v${{ steps.version.outputs.version }}$"; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Compile binaries
        if: steps.tag.outputs.exists == 'false'
        run: |
          for target in \
            "x86_64-unknown-linux-gnu:imp-linux-x64" \
            "aarch64-unknown-linux-gnu:imp-linux-arm64" \
            "x86_64-apple-darwin:imp-macos-x64" \
            "aarch64-apple-darwin:imp-macos-arm64" \
            "x86_64-pc-windows-msvc:imp-windows-x64.exe"; do
            triple="${target%%:*}"
            output="${target##*:}"
            deno run -A tools/compile.js --target "$triple" --output "$output"
            sha256sum "$output" > "$output.sha256"
          done

      - name: Create release
        if: steps.tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            imp-linux-x64
            imp-linux-x64.sha256
            imp-linux-arm64
            imp-linux-arm64.sha256
            imp-macos-x64
            imp-macos-x64.sha256
            imp-macos-arm64
            imp-macos-arm64.sha256
            imp-windows-x64.exe
            imp-windows-x64.exe.sha256
